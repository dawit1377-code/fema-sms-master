<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Settings | FEMA SMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #f0f2f5; }
        .sidebar { height: 100vh; width: 250px; position: fixed; background: #004aad; color: white; padding-top: 20px; }
        .main-content { margin-left: 250px; padding: 30px; }
        .sidebar a { color: white; text-decoration: none; display: block; padding: 15px 25px; transition: 0.3s; }
        .sidebar a:hover { background: rgba(255,255,255,0.1); }
        .settings-card { background: white; border-radius: 15px; border: none; padding: 25px; }
        .form-check-input:checked { background-color: #004aad; border-color: #004aad; }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar shadow">
        <h4 class="text-center fw-bold mb-4">FEMA SMS</h4>
        <a href="dashboard.html"><i class="fas fa-home me-2"></i> Dashboard</a>
        <a href="students.html"><i class="fas fa-user-graduate me-2"></i> Students</a>
        <a href="teachers.html"><i class="fas fa-chalkboard-teacher me-2"></i> Teachers</a>
        <a href="attendance.html"><i class="fas fa-chart-line me-2"></i> Attendance</a>
        <a href="finance.html"><i class="fas fa-wallet me-2"></i> Finance</a>
        <a href="settings.html" class="bg-white text-primary fw-bold"><i class="fas fa-cog me-2"></i> Settings</a>
        <hr>
        <a href="login.html" class="text-warning"><i class="fas fa-sign-out-alt me-2"></i> Logout</a>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <h2 class="fw-bold mb-4">System Settings</h2>

        <div class="row g-4">
            <div class="col-md-6">
                <div class="card settings-card shadow-sm">
                    <h5 class="fw-bold mb-4"><i class="fas fa-globe me-2 text-primary"></i> Regionalization</h5>
                    
                    <div class="mb-4">
                        <label class="form-label fw-bold">Primary Calendar</label>
                        <select class="form-select">
                            <option selected>Ethiopian Calendar (E.C.)</option>
                            <option>Gregorian Calendar (G.C.)</option>
                        </select>
                        <small class="text-muted">This affects all attendance and financial reports.</small>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">System Language</label>
                        <div class="form-check form-switch mb-2">
                            <input class="form-check-input" type="checkbox" checked id="langAmharic">
                            <label class="form-check-label" for="langAmharic">Enable Amharic Interface (አማርኛ)</label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card settings-card shadow-sm">
                    <h5 class="fw-bold mb-4"><i class="fas fa-bell me-2 text-primary"></i> SMS Notifications</h5>
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" checked>
                        <label class="form-check-label">Auto-send Absence Alerts to Parents</label>
                    </div>
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" checked>
                        <label class="form-check-label">Telebirr Payment Confirmations</label>
                    </div>
                    <button class="btn btn-primary w-100 mt-3 fw-bold">Save All Changes</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
