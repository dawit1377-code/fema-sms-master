    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #f0f2f5; }
        .sidebar { height: 100vh; width: 250px; position: fixed; background: #004aad; color: white; padding-top: 20px; }
        .main-content { margin-left: 250px; padding: 30px; }
        .sidebar a { color: white; text-decoration: none; display: block; padding: 15px 25px; transition: 0.3s; }
        .sidebar a:hover { background: rgba(255,255,255,0.1); }
        .teacher-card { background: white; border-radius: 15px; border: none; overflow: hidden; }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar shadow">
        <h4 class="text-center fw-bold mb-4">FEMA SMS</h4>
        <a href="dashboard.html"><i class="fas fa-home me-2"></i> Dashboard</a>
        <a href="students.html"><i class="fas fa-user-graduate me-2"></i> Students</a>
        <a href="teachers.html" class="bg-white text-primary fw-bold"><i class="fas fa-chalkboard-teacher me-2"></i> Teachers</a>

        <hr>

    <!-- Main Content -->
    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold">Teacher Directory</h2>
            <button class="btn btn-primary shadow-sm"><i class="fas fa-user-plus me-2"></i> Add New Teacher</button>
        </div>

        <div class="card teacher-card shadow-sm">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Name</th>
