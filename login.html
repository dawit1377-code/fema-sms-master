<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Fema SMS Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f7f6; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { width: 100%; max-width: 400px; padding: 30px; border-radius: 15px; border: none; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .btn-primary { background: #004aad; border: none; padding: 12px; }
    </style>
</head>
<body>

    <div class="card login-card bg-white">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-primary">FEMA SMS</h3>
            <p class="text-muted">School Administration Portal</p>
        </div>
        <form>
            <div class="mb-3">
                <label class="form-label">School Email</label>
                <input type="email" class="form-control" placeholder="admin@schoolname.com">
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" placeholder="••••••••">
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="remember">
                <label class="form-check-label" for="remember">Remember me</label>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold">Login to Dashboard</button>
        </form>
        <div class="text-center mt-4">
            <a href="index.html" class="text-decoration-none small text-muted">← Back to Home</a>
        </div>
    </div>

</body>
</html>
