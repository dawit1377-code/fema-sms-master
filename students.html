<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management | FEMA SMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #f0f2f5; }
        .sidebar { height: 100vh; width: 250px; position: fixed; background: #004aad; color: white; padding-top: 20px; }
        .main-content { margin-left: 250px; padding: 30px; }
        .sidebar a { color: white; text-decoration: none; display: block; padding: 15px 25px; transition: 0.3s; }
        .sidebar a:hover { background: rgba(255,255,255,0.1); }
        .student-table { background: white; border-radius: 15px; overflow: hidden; }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar shadow">
        <h4 class="text-center fw-bold mb-4">FEMA SMS</h4>
        <a href="dashboard.html"><i class="fas fa-home me-2"></i> Dashboard</a>
        <a href="students.html" class="bg-white text-primary fw-bold"><i class="fas fa-user-graduate me-2"></i> Students</a>
        <a href="#"><i class="fas fa-chalkboard-teacher me-2"></i> Teachers</a>
        <a href="finance.html"><i class="fas fa-wallet me-2"></i> Finance</a>
        <hr>
        <a href="login.html" class="text-warning"><i class="fas fa-sign-out-alt me-2"></i> Logout</a>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold">Student Registry</h2>
            <button class="btn btn-primary shadow-sm"><i class="fas fa-plus me-2"></i> Register New Student</button>
        </div>

        <div class="card student-table shadow-sm border-0">
            <div class="p-3 bg-light border-bottom">
                <input type="text" class="form-control w-25" placeholder="Search by Name or ID...">
            </div>
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Grade</th>
                        <th>Section</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><strong>REG/2026/001</strong></td>
                        <td>Abebe Kebede</td>
                        <td>Grade 10</td>
                        <td>Section A</td>
                        <td><span class="badge bg-success">Active</span></td>
                        <td><button class="btn btn-sm btn-outline-primary">View Profile</button></td>
                    </tr>
                    <tr>
                        <td><strong>REG/2026/002</strong></td>
                        <td>Saba Hailu</td>
                        <td>Grade 11</td>
                        <td>Section B</td>
                        <td><span class="badge bg-success">Active</span></td>
                        <td><button class="btn btn-sm btn-outline-primary">View Profile</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
