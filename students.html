<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management | FEMA SMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #f0f2f5; }
        .sidebar { height: 100vh; width: 250px; position: fixed; background: #004aad; color: white; padding-top: 20px; }
        .main-content { margin-left: 250px; padding: 30px; }
        .sidebar a { color: white; text-decoration: none; display: block; padding: 15px 25px; transition: 0.3s; }
        .sidebar a:hover { background: rgba(255,255,255,0.1); }
        .student-table { background: white; border-radius: 15px; overflow: hidden; }
    </style>
</head>
<body>

    <div class="sidebar shadow">
        <h4 class="text-center fw-bold mb-4">FEMA SMS</h4>
        <a href="dashboard.html"><i class="fas fa-home me-2"></i> Dashboard</a>
        <a href="students.html" class="bg-white text-primary fw-bold"><i class="fas fa-user-graduate me-2"></i> Students</a>
        <a href="teachers.html"><i class="fas fa-chalkboard-teacher me-2"></i> Teachers</a>
        <a href="attendance.html"><i class="fas fa-chart-line me-2"></i> Attendance</a>
        <a href="finance.html"><i class="fas fa-wallet me-2"></i> Finance</a>
        <a href="settings.html"><i class="fas fa-cog me-2"></i> Settings</a>
        <hr>
        <a href="login.html" class="text-warning"><i class="fas fa-sign-out-alt me-2"></i> Logout</a>
    </div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold">Student Registry</h2>
            <button class="btn btn-primary shadow-sm" data-bs-toggle="modal" data-bs-target="#studentModal">
                <i class="fas fa-plus me-2"></i> Register New Student
            </button>
        </div>

        <div class="card student-table shadow-sm border-0">
            <div class="p-3 bg-light border-bottom">
                <input type="text" id="searchBar" class="form-control w-25" placeholder="Search by Name..." onkeyup="searchStudents()">
            </div>
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Grade</th>
                        <th>Section</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="studentTableBody">
                    </tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="studentModal" tabindex="-1" aria-hidden="true">
        <div class="modal-content modal-dialog p-4">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">Add Student</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="studentForm">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" id="studName" class="form-control" required placeholder="e.g. Almaz Ayana">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Grade</label>
                        <select id="studGrade" class="form-select">
                            <option>Grade 9</option>
                            <option>Grade 10</option>
                            <option>Grade 11</option>
                            <option>Grade 12</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Section</label>
                        <input type="text" id="studSec" class="form-control" required placeholder="e.g. Section A">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Save Student</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Default seed data if browser memory is empty
        let defaultStudents = [
            { id: "REG/2026/001", name: "Abebe Kebede", grade: "Grade 10", section: "Section A", status: "Active" },
            { id: "REG/2026/002", name: "Saba Hailu", grade: "Grade 11", section: "Section B", status: "Active" }
        ];

        // Load data from LocalStorage or use defaults
        let students = JSON.parse(localStorage.getItem('fema_students')) || defaultStudents;

        function renderTable() {
            const tbody = document.getElementById('studentTableBody');
            tbody.innerHTML = '';
            students.forEach((student, index) => {
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${student.id}</strong></td>
                        <td>${student.name}</td>
                        <td>${student.grade}</td>
                        <td>${student.section}</td>
                        <td><span class="badge bg-success">${student.status}</span></td>
                        <td><button class="btn btn-sm btn-outline-danger" onclick="deleteStudent(${index})">Remove</button></td>
                    </tr>
                `;
            });
            // Keep localStorage updated
            localStorage.setItem('fema_students', JSON.stringify(students));
        }

        // Add execution logic to form
        document.getElementById('studentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const newStudent = {
                id: `REG/2026/00${students.length + 1}`,
                name: document.getElementById('studName').value,
                grade: document.getElementById('studGrade').value,
                section: document.getElementById('studSec').value,
                status: "Active"
            };
            students.push(newStudent);
            renderTable();
            
            // Close popup modal cleanly
            const modalEl = document.getElementById('studentModal');
            const modal = bootstrap.Modal.getInstance(modalEl);
            modal.hide();
            document.getElementById('studentForm').reset();
        });

        function deleteStudent(index) {
            if(confirm("Are you sure you want to remove this student record?")) {
                students.splice(index, 1);
                renderTable();
            }
        }

        function searchStudents() {
            let filter = document.getElementById('searchBar').value.toLowerCase();
            let rows = document.getElementById('studentTableBody').getElementsByTagName('tr');
            for (let row of rows) {
                let nameCell = row.getElementsByTagName('td')[1];
                if (nameCell) {
                    let text = nameCell.textContent || nameCell.innerText;
                    row.style.display = text.toLowerCase().indexOf(filter) > -1 ? "" : "none";
                }
            }
        }

        // Initialize table rendering on load
        renderTable();
    </script>
</body>
</html>
