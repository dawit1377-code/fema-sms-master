<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Directory | FEMA SMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #f0f2f5; }
        .sidebar { height: 100vh; width: 250px; position: fixed; background: #004aad; color: white; padding-top: 20px; }
        .main-content { margin-left: 250px; padding: 30px; }
        .sidebar a { color: white; text-decoration: none; display: block; padding: 15px 25px; transition: 0.3s; }
        .sidebar a:hover { background: rgba(255,255,255,0.1); }
        .teacher-table { background: white; border-radius: 15px; overflow: hidden; }
        .table-avatar { width: 35px; height: 35px; object-fit: cover; border-radius: 50%; margin-right: 10px; }
    </style>
</head>
<body>

    <div class="sidebar shadow">
        <h4 class="text-center fw-bold mb-4">FEMA SMS</h4>
        <a href="dashboard.html"><i class="fas fa-home me-2"></i> Dashboard</a>
        <a href="students.html"><i class="fas fa-user-graduate me-2"></i> Students</a>
        <a href="teachers.html" class="bg-white text-primary fw-bold"><i class="fas fa-chalkboard-teacher me-2"></i> Teachers</a>
        <a href="attendance.html"><i class="fas fa-chart-line me-2"></i> Attendance</a>
        <a href="finance.html"><i class="fas fa-wallet me-2"></i> Finance</a>
        <a href="settings.html"><i class="fas fa-cog me-2"></i> Settings</a>
        <hr>
        <a href="login.html" class="text-warning"><i class="fas fa-sign-out-alt me-2"></i> Logout</a>
    </div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold">Teacher Directory</h2>
            <button class="btn btn-primary shadow-sm" data-bs-toggle="modal" data-bs-target="#teacherModal">
                <i class="fas fa-user-plus me-2"></i> Add New Teacher
            </button>
        </div>

        <div class="card teacher-table shadow-sm border-0">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Instructor Details</th>
                        <th>Subject Department</th>
                        <th>Assigned Roster Streams</th>
                        <th>Mobile Number</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="teacherTableBody">
                    </tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="teacherModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-content p-4">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">Register Faculty Profile</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="teacherForm">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Profile Photo File</label>
                        <input type="file" id="teachPhoto" class="form-control" accept="image/*">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Full Name</label>
                        <input type="text" id="teachName" class="form-control" required placeholder="e.g. Genet Assefa">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Subject Department</label>
                        <input type="text" id="teachSubject" class="form-control" required placeholder="e.g. History / Chemistry">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Assigned Grade Streams</label>
                        <input type="text" id="teachClasses" class="form-control" required placeholder="e.g. Grade 10-A, Grade 12-C">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Contact Mobile Phone</label>
                        <input type="text" id="teachPhone" class="form-control" required placeholder="e.g. +251 912...">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold">Save Teacher Account</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Critical Authentication Route Guard Layer
        if (localStorage.getItem('fema_auth_session') !== 'authenticated_true_token') {
            window.location.href = "login.html";
        }

        const fallbackTeacherAvatar = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23004aad'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z'/></svg>";

        const defaultTeachers = [
            { name: "Mulugeta Tesfaye", subject: "Mathematics", classes: "Grade 10-A, 11-B", phone: "+251 912 345 678", status: "Active", photo: fallbackTeacherAvatar },
            { name: "Genet Assefa", subject: "Physics", classes: "Grade 12-C", phone: "+251 922 987 654", status: "Active", photo: fallbackTeacherAvatar }
        ];

        let teachers = JSON.parse(localStorage.getItem('fema_teachers')) || defaultTeachers;

        function renderTeachers() {
            const tbody = document.getElementById('teacherTableBody');
            tbody.innerHTML = '';
            teachers.forEach((teacher, idx) => {
                tbody.innerHTML += `
                    <tr>
                        <td>
                            <img src="${teacher.photo || fallbackTeacherAvatar}" class="table-avatar shadow-sm">
                            <strong>${teacher.name}</strong>
                        </td>
                        <td><span class="badge bg-light text-dark border">${teacher.subject}</span></td>
                        <td>${teacher.classes}</td>
                        <td><code>${teacher.phone}</code></td>
                        <td><span class="badge bg-success">${teacher.status}</span></td>
                        <td><button class="btn btn-sm btn-outline-danger border-0" onclick="deleteTeacher(${idx})"><i class="fas fa-trash"></i></button></td>
                    </tr>
                `;
            });
            localStorage.setItem('fema_teachers', JSON.stringify(teachers));
        }

        document.getElementById('teacherForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const photoFile = document.getElementById('teachPhoto').files[0];

            if(photoFile) {
                const reader = new FileReader();
                reader.onloadend = function() {
                    saveTeacherProfile(reader.result);
                }
                reader.readAsDataURL(photoFile);
            } else {
                saveTeacherProfile(fallbackTeacherAvatar);
            }
        });

        function saveTeacherProfile(photoBase64) {
            const newTeach = {
                name: document.getElementById('teachName').value,
                subject: document.getElementById('teachSubject').value,
                classes: document.getElementById('teachClasses').value,
                phone: document.getElementById('teachPhone').value,
                status: "Active",
                photo: photoBase64
            };
            teachers.push(newTeach);
            renderTeachers();
            
            bootstrap.Modal.getInstance(document.getElementById('teacherModal')).hide();
            document.getElementById('teacherForm').reset();
        }

        function deleteTeacher(index) {
            if(confirm("Are you sure you want to completely remove this instructor profile account file?")) {
                teachers.splice(index, 1);
                renderTeachers();
            }
        }

        document.addEventListener("DOMContentLoaded", renderTeachers);
    </script>
</body>
</html>
