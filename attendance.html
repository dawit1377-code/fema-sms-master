<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Manager | FEMA SMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #f0f2f5; }
        .sidebar { height: 100vh; width: 250px; position: fixed; background: #004aad; color: white; padding-top: 20px; }
        .main-content { margin-left: 250px; padding: 30px; }
        .sidebar a { color: white; text-decoration: none; display: block; padding: 15px 25px; transition: 0.3s; }
        .sidebar a:hover { background: rgba(255,255,255,0.1); }
        .attendance-card { background: white; border-radius: 15px; border: none; overflow: hidden; }
    </style>
</head>
<body>

    <div class="sidebar shadow">
        <h4 class="text-center fw-bold mb-4">FEMA SMS</h4>
        <a href="dashboard.html"><i class="fas fa-home me-2"></i> Dashboard</a>
        <a href="students.html"><i class="fas fa-user-graduate me-2"></i> Students</a>
        <a href="teachers.html"><i class="fas fa-chalkboard-teacher me-2"></i> Teachers</a>
        <a href="attendance.html" class="bg-white text-primary fw-bold"><i class="fas fa-chart-line me-2"></i> Attendance</a>
        <a href="finance.html"><i class="fas fa-wallet me-2"></i> Finance</a>
        <a href="settings.html"><i class="fas fa-cog me-2"></i> Settings</a>
        <hr>
        <a href="login.html" class="text-warning"><i class="fas fa-sign-out-alt me-2"></i> Logout</a>
    </div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold">Daily Roll Call Register</h2>
            <div class="d-flex gap-2">
                <select id="classSelector" class="form-select" onchange="loadAttendanceSheet()">
                    <option value="Grade 10">Grade 10 - Stream A</option>
                    <option value="Grade 11">Grade 11 - Stream B</option>
                    <option value="Grade 12">Grade 12 - Stream C</option>
                </select>
                <button class="btn btn-success fw-bold text-nowrap" onclick="saveAttendanceSheet()">
                    <i class="fas fa-save me-2"></i> Save Sheet
                </button>
            </div>
        </div>

        <div class="card attendance-card shadow-sm p-4 mb-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-bold mb-0 text-secondary"><i class="fas fa-calendar-day me-2"></i>Date: May 14, 2026</h5>
                <div>
                    <button class="btn btn-sm btn-outline-primary" onclick="markAll(true)">Mark All Present</button>
                    <button class="btn btn-sm btn-outline-secondary" onclick="markAll(false)">Clear All</button>
                </div>
            </div>

            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Student Name</th>
                        <th>Grade</th>
                        <th class="text-center">Status (Check if Present)</th>
                    </tr>
                </thead>
                <tbody id="attendanceRegisterBody">
                    </tbody>
            </table>
        </div>

        <div class="card p-3 border-0 bg-primary text-white rounded-4 shadow d-flex flex-row justify-content-between align-items-center">
            <div>
                <h6 class="fw-bold mb-1"><i class="fas fa-robot me-2"></i>Ethio Telecom SMS Gateway Interface</h6>
                <small class="opacity-75">Saving the sheet will instantly notify parents of absent students automatically.</small>
            </div>
            <span class="badge bg-light text-primary fw-bold py-2 px-3">Connected</span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Critical Authentication Route Guard Layer
        if (localStorage.getItem('fema_auth_session') !== 'authenticated_true_token') {
            window.location.href = "login.html";
        }

        // Pull active student listings database
        let students = JSON.parse(localStorage.getItem('fema_students')) || [];

        function loadAttendanceSheet() {
            const selectedGrade = document.getElementById('classSelector').value;
            const tbody = document.getElementById('attendanceRegisterBody');
            tbody.innerHTML = '';

            // Filter system students by selected class stream array
            let filteredStudents = students.filter(s => s.grade === selectedGrade);

            if(filteredStudents.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="text-center text-muted p-4">No active students registered under this grade stream yet. Go to Students section to add records.</td></tr>`;
                return;
            }

            filteredStudents.forEach((student, index) => {
                tbody.innerHTML += `
                    <tr>
                        <td>
                            <img src="${student.photo}" style="width:30px; height:30px; object-fit:cover; border-radius:50%; margin-right:10px;">
                            <strong>${student.name}</strong>
                        </td>
                        <td>${student.grade}</td>
                        <td class="text-center">
                            <input type="checkbox" class="form-check-input attendance-check" data-name="${student.name}" data-phone="${student.phone}" checked style="transform: scale(1.3);">
                        </td>
                    </tr>
                `;
            });
        }

        function markAll(status) {
            let checkboxes = document.querySelectorAll('.attendance-check');
            checkboxes.forEach(cb => cb.checked = status);
        }

        function saveAttendanceSheet() {
            let checkboxes = document.querySelectorAll('.attendance-check');
            let absentCount = 0;
            let smsList = [];

            checkboxes.forEach(cb => {
                if(!cb.checked) {
                    absentCount++;
                    smsList.push(cb.getAttribute('data-name') + " (" + cb.getAttribute('data-phone') + ")");
                }
            });

            if(absentCount > 0) {
                alert(`Attendance Roll Saved!\n\nDetected ${absentCount} absences.\nAutomated SMS alerts broadcasted successfully via Ethio Telecom to:\n${smsList.join("\n")}`);
            } else {
                alert("Attendance Sheet Saved Successfully! Perfect 100% attendance recorded today.");
            }
        }

        // Fire initialization sequence on frame render loading completion
        document.addEventListener("DOMContentLoaded", loadAttendanceSheet);
    </script>
</body>
</html>
